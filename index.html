<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FocusBlock" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />
    <title>FocusBlock Pro</title>

    <!-- Ana ekrana eklenebilir uygulama (iOS'ta bildirimler için gerekli) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Uygulama iskeleti JS tarafından oluşturulur (yan menü + görünüm + alt menü) -->
    <div id="app" class="shell"></div>
    <noscript>FocusBlock Pro çalışmak için JavaScript gerektirir.</noscript>

    <!-- Modal ve bildirim (toast) kökleri -->
    <div id="modalRoot"></div>
    <div id="toastRoot" aria-live="polite"></div>

    <input
      type="file"
      id="importFile"
      accept=".json,application/json,text/plain"
      hidden
    />

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
