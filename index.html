<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusBlock</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body
    class="h-screen w-screen overflow-hidden font-sans antialiased select-none transition-colors duration-500"
  >
    <!-- UYGULAMA KAPSAYICISI -->
    <div
      id="app"
      class="h-full w-full flex flex-col justify-between relative z-10 px-4 py-6 sm:px-8 sm:py-8"
    >
      <!-- 1. ÜST BAR (HEADER) -->
      <header class="w-full max-w-xl mx-auto flex items-center justify-between">
        <!-- Logo / Marka -->
        <div class="flex items-center gap-2">
          <div class="w-2.5 h-2.5 rounded-full bg-current opacity-80"></div>
          <span class="text-xs font-black tracking-widest uppercase opacity-70"
            >FocusBlock</span
          >
        </div>

        <!-- Ayarlar Butonu -->
        <button
          id="settingsBtn"
          class="p-2.5 rounded-2xl bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 backdrop-blur-md transition-all active:scale-95"
          aria-label="Ayarlar"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 opacity-80"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
            />
          </svg>
        </button>
      </header>

      <!-- 2. ANA KART (MODERN GLASS CARD) -->
      <main
        class="flex-1 flex flex-col items-center justify-center max-w-xl w-full mx-auto my-auto"
      >
        <div
          class="w-full bg-black/5 dark:bg-white/[0.04] border border-black/10 dark:border-white/10 backdrop-blur-2xl rounded-3xl p-6 sm:p-10 shadow-2xl flex flex-col items-center transition-all"
        >
          <!-- Görev/Niyet Girişi -->
          <div class="w-full max-w-sm mb-6">
            <input
              type="text"
              id="taskInput"
              class="w-full text-center text-base sm:text-lg font-medium bg-transparent border-b border-black/10 dark:border-white/10 focus:border-current focus:outline-none pb-2 transition-all placeholder:opacity-30"
              placeholder="Neye odaklanıyorsun?"
              data-i18n-placeholder="taskPlaceholder"
            />
          </div>

          <!-- DAİRESEL SAYAÇ VE MERKEZ İÇERİK -->
          <div
            class="relative w-64 h-64 sm:w-80 sm:h-80 flex items-center justify-center my-2"
          >
            <svg
              class="w-full h-full transform -rotate-90 stroke-current"
              viewBox="0 0 100 100"
            >
              <!-- Arka Plan Dairesi -->
              <circle
                cx="50"
                cy="50"
                r="44"
                class="opacity-10"
                stroke-width="3"
                fill="transparent"
              />
              <!-- İlerleme Dairesi -->
              <circle
                id="progressRing"
                cx="50"
                cy="50"
                r="44"
                class="transition-all duration-1000 ease-linear"
                stroke-width="3.5"
                stroke-dasharray="276.46"
                stroke-dashoffset="0"
                stroke-linecap="round"
                fill="transparent"
              />
            </svg>

            <!-- Sayaç İçerik -->
            <div
              class="absolute inset-0 flex flex-col items-center justify-center space-y-1"
            >
              <!-- Mod Rozeti -->
              <div
                id="modeBadge"
                class="px-3.5 py-1 rounded-full text-[10px] sm:text-xs font-bold tracking-widest uppercase transition-all border backdrop-blur-md"
              >
                <span data-i18n="work">Odaklanma</span>
              </div>

              <!-- Dijital Sayaç -->
              <div
                id="timerDisplay"
                class="timer-display text-5xl sm:text-6xl font-black tracking-tight"
              >
                50:00
              </div>

              <!-- Entegre Blok Kontrol Rozeti -->
              <div
                class="flex items-center gap-2 bg-black/5 dark:bg-white/10 px-3 py-1 rounded-full border border-black/5 dark:border-white/10 mt-1"
              >
                <button
                  id="removeSetBtn"
                  class="w-5 h-5 flex items-center justify-center text-xs font-bold opacity-60 hover:opacity-100 transition-opacity"
                  title="Blok Eksilt"
                >
                  −
                </button>
                <span
                  class="text-[11px] font-bold uppercase tracking-wider opacity-80"
                >
                  <span data-i18n="set">Blok</span>
                  <span id="currentSet">1</span>/<span id="totalSets">4</span>
                </span>
                <button
                  id="addSetBtn"
                  class="w-5 h-5 flex items-center justify-center text-xs font-bold opacity-60 hover:opacity-100 transition-opacity"
                  title="Blok Ekle"
                >
                  +
                </button>
              </div>
            </div>
          </div>

          <!-- Kontrol Butonları -->
          <div class="flex items-center justify-center gap-6 mt-6 w-full">
            <!-- Sıfırla -->
            <button
              id="resetBtn"
              class="p-3.5 rounded-2xl bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 transition-all active:scale-90"
              title="Sıfırla"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5 opacity-70"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                />
              </svg>
            </button>

            <!-- Başlat / Duraklat (Ana Aksiyon Butonu) -->
            <button
              id="startPauseBtn"
              class="px-8 py-4 rounded-2xl shadow-xl text-white font-bold transition-all transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2 min-w-[140px]"
            >
              <svg
                id="playIcon"
                xmlns="http://www.w3.org/2000/svg"
                class="w-6 h-6"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path d="M8 5v14l11-7z" />
              </svg>
              <svg
                id="pauseIcon"
                xmlns="http://www.w3.org/2000/svg"
                class="w-6 h-6 hidden"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" />
              </svg>
              <span id="startPauseLabel">Başlat</span>
            </button>

            <!-- Atla -->
            <button
              id="skipBtn"
              class="p-3.5 rounded-2xl bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 transition-all active:scale-90"
              title="Atla"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5 opacity-70"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M13 5l7 7-7 7M5 5l7 7-7 7"
                />
              </svg>
            </button>
          </div>
        </div>
      </main>

      <!-- 3. ALT BİLGİ (FOOTER) -->
      <footer
        class="w-full max-w-xl mx-auto text-center opacity-30 text-[10px] font-bold tracking-widest"
      >
        FOCUSBLOCK &copy; OĞUZ BATUHAN
      </footer>
    </div>

    <!-- Karartma Katmanı -->
    <div
      id="overlay"
      class="overlay fixed inset-0 bg-black/40 backdrop-blur-md z-40"
    ></div>

    <!-- 4. AYARLAR PANELİ -->
    <aside
      id="settingsPanel"
      class="settings-panel fixed inset-y-0 right-0 sm:right-6 sm:top-6 sm:bottom-6 w-full max-w-md sm:rounded-3xl z-50 flex flex-col border border-black/10 dark:border-white/10 shadow-2xl backdrop-blur-2xl overflow-hidden"
    >
      <!-- Panel Header -->
      <div
        class="flex items-center justify-between px-6 py-5 border-b border-black/5 dark:border-white/5"
      >
        <h2
          class="text-xs font-black uppercase tracking-widest opacity-80"
          data-i18n="settings"
        >
          Ayarlar
        </h2>
        <button
          id="closeSettingsBtn"
          class="p-2 rounded-xl hover:bg-black/5 dark:hover:bg-white/10 transition-all active:scale-95"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 opacity-70"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      <!-- Tab Navigasyonu -->
      <div
        class="flex border-b border-black/5 dark:border-white/5 px-6 pt-2 gap-4 text-xs font-bold"
      >
        <button
          id="tabBtnTimer"
          class="tab-btn active pb-3 transition-all relative"
          data-tab="timer"
          data-i18n="tabTimer"
        >
          Zamanlayıcı
        </button>
        <button
          id="tabBtnAppearance"
          class="tab-btn pb-3 transition-all opacity-40 hover:opacity-100 relative"
          data-tab="appearance"
          data-i18n="tabAppearance"
        >
          Görünüm
        </button>
      </div>

      <!-- Tab İçerikleri -->
      <div class="flex-1 overflow-y-auto px-6 py-6 space-y-6">
        <!-- SEÇENEK 1: ZAMANLAYICI AYARLARI -->
        <div id="tabContentTimer" class="tab-content space-y-5">
          <!-- Çalışma Süresi -->
          <div
            class="flex items-center justify-between bg-black/5 dark:bg-white/5 p-4 rounded-2xl"
          >
            <div>
              <span class="block text-xs font-bold" data-i18n="workDuration"
                >Çalışma Süresi</span
              >
              <span class="text-[10px] opacity-50">Dakika cinsinden</span>
            </div>
            <div class="flex items-center gap-2">
              <button
                class="stepper-btn text-sm w-7 h-7 rounded-lg bg-black/5 dark:bg-white/10 flex items-center justify-center active:scale-90"
                data-target="workInput"
                data-step="-1"
              >
                −
              </button>
              <input
                type="number"
                id="workInput"
                min="1"
                max="120"
                class="w-10 text-center bg-transparent text-sm font-extrabold focus:outline-none"
              />
              <button
                class="stepper-btn text-sm w-7 h-7 rounded-lg bg-black/5 dark:bg-white/10 flex items-center justify-center active:scale-90"
                data-target="workInput"
                data-step="1"
              >
                +
              </button>
            </div>
          </div>

          <!-- Mola Süresi -->
          <div
            class="flex items-center justify-between bg-black/5 dark:bg-white/5 p-4 rounded-2xl"
          >
            <div>
              <span class="block text-xs font-bold" data-i18n="breakDuration"
                >Mola Süresi</span
              >
              <span class="text-[10px] opacity-50">Dakika cinsinden</span>
            </div>
            <div class="flex items-center gap-2">
              <button
                class="stepper-btn text-sm w-7 h-7 rounded-lg bg-black/5 dark:bg-white/10 flex items-center justify-center active:scale-90"
                data-target="breakInput"
                data-step="-1"
              >
                −
              </button>
              <input
                type="number"
                id="breakInput"
                min="1"
                max="60"
                class="w-10 text-center bg-transparent text-sm font-extrabold focus:outline-none"
              />
              <button
                class="stepper-btn text-sm w-7 h-7 rounded-lg bg-black/5 dark:bg-white/10 flex items-center justify-center active:scale-90"
                data-target="breakInput"
                data-step="1"
              >
                +
              </button>
            </div>
          </div>

          <!-- Hedef Blok Sayısı -->
          <div
            class="flex items-center justify-between bg-black/5 dark:bg-white/5 p-4 rounded-2xl"
          >
            <div>
              <span class="block text-xs font-bold" data-i18n="setsCount"
                >Hedef Bloklar</span
              >
              <span class="text-[10px] opacity-50">Günlük hedef küme</span>
            </div>
            <div class="flex items-center gap-2">
              <button
                class="stepper-btn text-sm w-7 h-7 rounded-lg bg-black/5 dark:bg-white/10 flex items-center justify-center active:scale-90"
                data-target="setsInput"
                data-step="-1"
              >
                −
              </button>
              <input
                type="number"
                id="setsInput"
                min="1"
                max="20"
                class="w-10 text-center bg-transparent text-sm font-extrabold focus:outline-none"
              />
              <button
                class="stepper-btn text-sm w-7 h-7 rounded-lg bg-black/5 dark:bg-white/10 flex items-center justify-center active:scale-90"
                data-target="setsInput"
                data-step="1"
              >
                +
              </button>
            </div>
          </div>
        </div>

        <!-- SEÇENEK 2: GÖRÜNÜM VE DİL -->
        <div id="tabContentAppearance" class="tab-content space-y-6 hidden">
          <!-- Dil -->
          <div class="space-y-2">
            <label
              class="block text-[10px] font-extrabold uppercase tracking-widest opacity-50"
              data-i18n="language"
              >Dil</label
            >
            <div class="grid grid-cols-2 gap-2">
              <button
                data-lang="tr"
                class="lang-btn py-3 rounded-2xl border border-black/10 dark:border-white/10 font-semibold text-xs transition-all hover:bg-black/5 dark:hover:bg-white/5"
              >
                Türkçe
              </button>
              <button
                data-lang="en"
                class="lang-btn py-3 rounded-2xl border border-black/10 dark:border-white/10 font-semibold text-xs transition-all hover:bg-black/5 dark:hover:bg-white/5"
              >
                English
              </button>
            </div>
          </div>

          <!-- Tema Kartları -->
          <div class="space-y-2">
            <label
              class="block text-[10px] font-extrabold uppercase tracking-widest opacity-50"
              data-i18n="theme"
              >Tema Paleti</label
            >
            <div class="grid grid-cols-2 gap-2.5" id="themeButtons">
              <button
                data-theme="dark"
                class="theme-btn p-3 rounded-2xl border border-black/10 dark:border-white/10 text-xs font-semibold flex items-center gap-3 transition-all hover:scale-[1.02]"
              >
                <span
                  class="w-4 h-4 rounded-full bg-zinc-900 border border-indigo-500"
                ></span>
                Dark Glass
              </button>
              <button
                data-theme="light"
                class="theme-btn p-3 rounded-2xl border border-black/10 dark:border-white/10 text-xs font-semibold flex items-center gap-3 transition-all hover:scale-[1.02]"
              >
                <span
                  class="w-4 h-4 rounded-full bg-slate-100 border border-slate-900"
                ></span>
                Light Minimal
              </button>
              <button
                data-theme="forest"
                class="theme-btn p-3 rounded-2xl border border-black/10 dark:border-white/10 text-xs font-semibold flex items-center gap-3 transition-all hover:scale-[1.02]"
              >
                <span class="w-4 h-4 rounded-full bg-emerald-600"></span>
                Emerald
              </button>
              <button
                data-theme="ocean"
                class="theme-btn p-3 rounded-2xl border border-black/10 dark:border-white/10 text-xs font-semibold flex items-center gap-3 transition-all hover:scale-[1.02]"
              >
                <span class="w-4 h-4 rounded-full bg-sky-500"></span> Ocean Blue
              </button>
              <button
                data-theme="sunset"
                class="theme-btn p-3 rounded-2xl border border-black/10 dark:border-white/10 text-xs font-semibold flex items-center gap-3 transition-all hover:scale-[1.02]"
              >
                <span class="w-4 h-4 rounded-full bg-rose-500"></span> Sunset
              </button>
              <button
                data-theme="lavender"
                class="theme-btn p-3 rounded-2xl border border-black/10 dark:border-white/10 text-xs font-semibold flex items-center gap-3 transition-all hover:scale-[1.02]"
              >
                <span class="w-4 h-4 rounded-full bg-purple-500"></span>
                Lavender
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Panel Footer -->
      <div class="p-6 border-t border-black/5 dark:border-white/5">
        <button
          id="clearStorageBtn"
          class="w-full py-3 px-4 rounded-2xl bg-red-500/10 hover:bg-red-500/20 text-red-600 dark:text-red-400 text-xs font-bold transition-all active:scale-95 flex items-center justify-center gap-2"
        >
          <span data-i18n="clearData">Sıfırla ve Temizle</span>
        </button>
      </div>
    </aside>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
